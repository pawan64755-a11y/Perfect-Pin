<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Relationship Cues — Pinterest Pin Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700;800&family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Montserrat:wght@700;800&family=Playfair+Display:wght@700;800&family=Lora:wght@600;700&family=Caveat:wght@600;700&family=Pacifico&family=League+Spartan:wght@600;700;800&family=Archivo+Black&family=Raleway:wght@700;800&family=DM+Sans:wght@700;800&family=Nunito:wght@700;800&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #121212;
    font-family: 'Poppins', -apple-system, Roboto, 'Segoe UI', sans-serif;
    color: #fff;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    height: 100dvh;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 0;
    overflow: hidden;
  }
  h1 {
    font-size: 15px;
    text-align: center;
    margin: 0 0 8px;
    font-weight: 600;
    color: #eee;
    letter-spacing: 0.5px;
    flex: 0 0 auto;
  }
  .canvas-container {
    position: relative;
    flex: 0 0 auto;
    width: auto;
    height: 46vh;
    max-height: 420px;
    max-width: 100%;
    aspect-ratio: 2 / 3;
    margin: 0 auto;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  canvas#card {
    width: 100%;
    height: 100%;
    display: block;
  }
  .placeholder-btn {
    position: absolute;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
  }
  .divider {
    position: absolute;
    left: 0; right: 0;
    height: 32px;
    margin-top: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: ns-resize;
    z-index: 5;
  }
  .divider .bar {
    width: 50px;
    height: 6px;
    background: #4CAF50;
    border-radius: 3px;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.35);
  }
  .hint {
    font-size: 12px;
    color: #777;
    text-align: center;
    margin-top: 6px;
    flex: 0 0 auto;
  }
  .controls {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 24px;
  }
  .row { display: flex; gap: 10px; }
  button {
    flex: 1;
    background: #2b2b2b;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
  }
  button:active { background: #3a3a3a; }
  button.primary { background: #4CAF50; border-color: #4CAF50; }
  button.primary:active { background: #43a047; }
  textarea {
    width: 100%;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    text-transform: uppercase;
    resize: none;
    min-height: 70px;
  }
  label.small {
    font-size: 13px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
  }
  input[type=range] { width: 100%; }
  #fileInput { display: none; }

  .swatchRow {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .fontRow {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    flex-shrink: 0;
  }
  .fontChip {
    flex: 0 0 auto;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 16px;
    white-space: nowrap;
  }
  .fontChip.selected {
    border-color: #4CAF50;
    background: #23331f;
    box-shadow: 0 0 0 1px #4CAF50;
  }
  .swatch {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid transparent;
    padding: 0;
    flex: 0 0 auto;
    position: relative;
    box-shadow: 0 0 0 1px #3a3a3a;
  }
  .swatch.selected {
    border-color: #4CAF50;
    box-shadow: 0 0 0 1px #4CAF50;
  }
  .toggleRow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1c1c1c;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    color: #eee;
  }
  .toggleRow input[type=checkbox] {
    width: 20px;
    height: 20px;
    accent-color: #4CAF50;
  }
  button:disabled {
    opacity: 0.4;
  }
  .colorPickBtn {
    flex: 1;
    background: #2b2b2b;
    color: #fff;
    border: 1px solid #3a3a3a;
    border-radius: 10px;
    padding: 13px 10px;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  .colorPickBtn input[type=color] {
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 6px;
    padding: 0;
    background: none;
    cursor: pointer;
  }
  #wordSel {
    position: absolute; display: none; z-index: 4; pointer-events: none;
    border: 2px dashed #4CAF50; border-radius: 6px;
    background: rgba(76,175,80,0.14);
  }
  .wordBar {
    display: none; flex: 0 0 auto; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 8px; padding: 6px 10px;
    background: #1c1c1c; border: 1px solid #4CAF50; border-radius: 10px;
  }
  .wordBar .wname {
    max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; font-weight: 700; color: #4CAF50;
  }
  .wordBar .wpct { font-size: 12px; color: #aaa; width: 40px; text-align: right; }
  .wordBar button { flex: 0 0 auto; width: 34px; padding: 6px 0; font-size: 16px; line-height: 1; }
  .wordBar input[type=range] { flex: 1; min-width: 0; }
  .wordBar .colorRow { flex: 1 0 100%; display: flex; align-items: center; gap: 8px; }
  .wordBar .colorRow .lbl { font-size: 12px; color: #aaa; flex: 0 0 auto; }
  .wordBar .colorRow input[type=color] { width: 34px; height: 30px; border: none; border-radius: 6px; padding: 0; background: none; flex: 0 0 auto; }
  .wordBar .qc { width: 28px; height: 28px; border-radius: 50%; padding: 0; flex: 0 0 auto; border: 2px solid #555; }
  .wordBar .colorRow .autoBtn { width: auto; margin-left: auto; padding: 6px 10px; font-size: 12px; }
  input.txt { width:100%; background:#1c1c1c; color:#fff; border:1px solid #3a3a3a; border-radius:10px; padding:12px; font-size:14px; font-family:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Relationship Cues — Pinterest Pin Maker</h1>

  <div class="canvas-container" id="canvasContainer">
    <canvas id="card" width="1080" height="1620"></canvas>
    <div class="placeholder-btn" id="placeholderHint">Select an image below</div>
    <div class="divider" id="divider"><div class="bar"></div></div>
    <div id="wordSel"></div>
  </div>
  <div class="wordBar" id="wordBar">
    <span class="wname" id="wordName"></span>
    <button id="wordMinus">−</button>
    <input type="range" id="wordScale" min="30" max="300" step="5" value="100" />
    <button id="wordPlus">+</button>
    <span class="wpct" id="wordPct">100%</span>
    <button id="wordReset" title="Reset this word">↺</button>
    <button id="wordClose" title="Done">✕</button>
    <div class="colorRow">
      <span class="lbl">🎨 Colour</span>
      <input type="color" id="wordColorPicker" value="#ffffff" />
      <button class="qc" data-c="#FFFFFF" style="background:#FFFFFF"></button>
      <button class="qc" data-c="#FFE14D" style="background:#FFE14D"></button>
      <button class="qc" data-c="#FF4D6D" style="background:#FF4D6D"></button>
      <button class="qc" data-c="#4DD0E1" style="background:#4DD0E1"></button>
      <button class="qc" data-c="#7CFC7C" style="background:#7CFC7C"></button>
      <button class="qc" data-c="#000000" style="background:#000000"></button>
      <button class="autoBtn" id="wordColorAuto">Auto</button>
    </div>
  </div>
  <div class="hint">👆 Tap any word to resize it · 📌 Drag the image to reposition · "Zoom" to crop tighter</div>

  <div class="controls">
    <label class="small">Font Size <span id="fontSizeVal">84</span>px (auto-shrinks to fit)
      <input type="range" id="fontSize" min="28" max="150" value="84" />
    </label>

    <textarea id="factText" autocomplete="off" placeholder="Write a curiosity hook (4-9 words)..."></textarea>

    <div class="toggleRow">
      <span>🔤 Full Text Card (no image)</span>
      <input type="checkbox" id="fullTextToggle" />
    </div>

    <div class="row">
      <button id="pickImageBtn">📷 Select Image</button>
      <button id="saveBtn" class="primary">💾 Save Post</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" />

    <label class="small">Font Style</label>
    <div class="fontRow" id="fontRow"></div>

    <label class="small">Colour Style</label>
    <div class="swatchRow" id="swatchRow"></div>

    <div class="row" id="fullTextExtras" style="display:none;">
      <button id="randomGradientBtn">🎨 Random Gradient</button>
      <label class="colorPickBtn" for="bgColorPicker">🖌️ Pick Colour
        <input type="color" id="bgColorPicker" value="#4CAF50" />
      </label>
    </div>

    <div id="fullTextSliders" style="display:none; flex-direction:column; gap:10px;">
      <label class="small">🌫️ Image Blur <span id="bgBlurVal">22</span>px
        <input type="range" id="bgBlur" min="0" max="60" value="22" />
      </label>
      <label class="small">🎨 Text Background (readability) <span id="bgTintVal">55</span>%
        <input type="range" id="bgTint" min="0" max="100" value="55" />
      </label>
    </div>

    <div class="toggleRow"><span>👆 Click Button (CTA)</span><input type="checkbox" id="ctaToggle" checked /></div>
    <div id="ctaControls" style="display:flex; flex-direction:column; gap:10px;">
      <div class="fontRow" id="ctaRow"></div>
      <input type="text" id="blogUrl" class="txt" placeholder="yourblog.com (shown on pin — saved)" autocapitalize="none" />
    </div>

    <div class="toggleRow">
      <span>✏️ Text Outline</span>
      <input type="checkbox" id="outlineToggle" />
    </div>
    <div id="outlineControls" style="display:none; flex-direction:column; gap:10px;">
      <label class="small">Outline Thickness <span id="outlineWidthVal">8</span>px
        <input type="range" id="outlineWidth" min="1" max="30" value="8" />
      </label>
      <div class="row">
        <label class="colorPickBtn" for="outlineColorPicker">🖍️ Outline Colour
          <input type="color" id="outlineColorPicker" value="#000000" />
        </label>
        <button id="outlineAutoBtn">✨ Auto Colour</button>
      </div>
    </div>

    <label class="small">Image Zoom / Crop <span id="zoomVal">100</span>%
      <input type="range" id="zoom" min="100" max="300" value="100" />
    </label>

    <label class="small">📌 Pin Title <span style="font-weight:400;color:#666;">sirf title — seedha paste karein</span></label>
    <textarea id="seoTitle" readonly style="text-transform:none; min-height:60px; font-size:14px;"></textarea>
    <button id="copyTitleBtn">📋 Copy Title</button>

    <label class="small">📝 Pin Description <span style="font-weight:400;color:#666;">sirf description — seedha paste karein</span></label>
    <textarea id="seoDesc" readonly style="text-transform:none; min-height:120px; font-size:14px;"></textarea>
    <button id="copyDescBtn">📋 Copy Description</button>
    <div class="hint">Saved image goes to your "Downloads" folder</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('card');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('canvasContainer');
  const divider = document.getElementById('divider');
  const placeholderHint = document.getElementById('placeholderHint');
  const factText = document.getElementById('factText');
  const fontSizeInput = document.getElementById('fontSize');
  const fontSizeVal = document.getElementById('fontSizeVal');
  const zoomInput = document.getElementById('zoom');
  const zoomVal = document.getElementById('zoomVal');
  const fileInput = document.getElementById('fileInput');
  const fullTextToggle = document.getElementById('fullTextToggle');
  const pickImageBtn = document.getElementById('pickImageBtn');
  const swatchRow = document.getElementById('swatchRow');
  const fontRow = document.getElementById('fontRow');
  const fullTextExtras = document.getElementById('fullTextExtras');
  const fullTextSliders = document.getElementById('fullTextSliders');
  const outlineToggle = document.getElementById('outlineToggle');
  const outlineControls = document.getElementById('outlineControls');
  const outlineWidthInput = document.getElementById('outlineWidth');
  const outlineWidthVal = document.getElementById('outlineWidthVal');
  const outlineColorPicker = document.getElementById('outlineColorPicker');
  const outlineAutoBtn = document.getElementById('outlineAutoBtn');
  const bgBlurInput = document.getElementById('bgBlur');
  const bgBlurVal = document.getElementById('bgBlurVal');
  const bgTintInput = document.getElementById('bgTint');
  const bgTintVal = document.getElementById('bgTintVal');
  const randomGradientBtn = document.getElementById('randomGradientBtn');
  const bgColorPicker = document.getElementById('bgColorPicker');

  // Canvas is 4:5 (width:height) — TEXT area on TOP, IMAGE area on BOTTOM
  const SIZE_W = 1080;
  const SIZE_H = 1620; // 2:3 = Pinterest's best-performing pin ratio
  const WATERMARK_TEXT = 'RELATIONSHIP CUES';

  // Pinterest-style card text ke liye sabse popular aur readable fonts —
  // bold, clean, big-impact fonts jo chhoti screen par bhi clearly padhe jaate hain.
  const FONT_OPTIONS = [
    { id: 'anton',        name: 'Anton',           stack: '"Anton", Arial, sans-serif',            weight: 400 },
    { id: 'bebas',        name: 'Bebas Neue',      stack: '"Bebas Neue", Arial, sans-serif',        weight: 400 },
    { id: 'montserrat',   name: 'Montserrat',      stack: '"Montserrat", Arial, sans-serif',        weight: 800 },
    { id: 'poppins',      name: 'Poppins',         stack: '"Poppins", Arial, sans-serif',           weight: 700 },
    { id: 'oswald',       name: 'Oswald',          stack: '"Oswald", Arial, sans-serif',             weight: 600 },
    { id: 'leaguespartan',name: 'League Spartan',  stack: '"League Spartan", Arial, sans-serif',    weight: 700 },
    { id: 'archivoblack', name: 'Archivo Black',   stack: '"Archivo Black", Arial, sans-serif',     weight: 400 },
    { id: 'raleway',      name: 'Raleway',         stack: '"Raleway", Arial, sans-serif',            weight: 800 },
    { id: 'dmsans',       name: 'DM Sans',         stack: '"DM Sans", Arial, sans-serif',            weight: 700 },
    { id: 'nunito',       name: 'Nunito',          stack: '"Nunito", Arial, sans-serif',             weight: 800 },
    { id: 'playfair',     name: 'Playfair Display',stack: '"Playfair Display", Georgia, serif',      weight: 700 },
    { id: 'lora',         name: 'Lora',            stack: '"Lora", Georgia, serif',                  weight: 600 },
    { id: 'baskerville',  name: 'Libre Baskerville',stack: '"Libre Baskerville", Georgia, serif',    weight: 700 },
    { id: 'caveat',       name: 'Caveat',          stack: '"Caveat", cursive',                       weight: 700 },
    { id: 'pacifico',     name: 'Pacifico',        stack: '"Pacifico", cursive',                     weight: 400 },
  ];

  // Selectable colour combinations: first colour = background, second = text.
  const COMBOS = [
    { bg: '#0F1E4A', text: '#F8BBD0', name: 'Navy Blue & Pastel Pink' },
    { bg: '#046C4E', text: '#FFF8E7', name: 'Emerald Green & Cream' },
    { bg: '#0F6B75', text: '#D9DEE3', name: 'Teal Blue & Silver' },
    { bg: '#0B1437', text: '#E8B4A0', name: 'Midnight Blue & Rose Gold' },
    { bg: '#5B6B2F', text: '#F5EBDD', name: 'Olive Green & Beige' },
    { bg: '#1E1E1E', text: '#F7F5F2', name: 'Charcoal Black & Soft White' },
    { bg: '#B8F2D6', text: '#0B2545', name: 'Mint Green & Dark Blue' },
    { bg: '#1F7A6B', text: '#FFE0C8', name: 'Sea Green & Soft Peach' },
    { bg: '#283593', text: '#EAF6FF', name: 'Indigo & Icy White' },
  ];

  let state = {
    image: null,
    fullText: false, // when true, no image is needed and text fills the whole card
    outline: false,   // text outline on/off
    outlineWidth: 8,  // outline thickness in px
    outlineColor: null, // null = auto (opposite of text colour), else hex
    bgBlur: 22,       // Full Text mode: blur (px) applied to the background photo
    bgTint: 0.55,     // Full Text mode: opacity of the colour layer between photo and text
    comboIndex: 0,    // which COMBOS entry is active (0 = Navy Blue & Pastel Pink)
    font: FONT_OPTIONS[0], // currently selected text font
    customBg: null,   // { bgColors: [hex] or [hex,hex], text } — Full Text mode only
    textRatio: 0.42,   // fraction of height given to the TEXT area (top)
    fontSize: 84,
    ctaOn: true, ctaText: "READ FULL ARTICLE →", blogUrl: "",
    text: factText.value,
    zoom: 1,          // 1 = fully fit, higher = zoomed in / more cropped
    centerX: null,    // center point of the crop window, in source-image pixels
    centerY: null,
    cropW: null,
    cropH: null,
    splitY: 0,
    wordScales: {},   // per-word size multiplier, keyed by word index (1 = normal)
    wordColors: {},   // per-word colour override, keyed by word index
    selectedWord: null,
    wordRects: []
  };

  const wordSel = document.getElementById('wordSel');
  const wordBar = document.getElementById('wordBar');
  const wordName = document.getElementById('wordName');
  const wordScaleInput = document.getElementById('wordScale');
  const wordPct = document.getElementById('wordPct');
  const wordColorPicker = document.getElementById('wordColorPicker');

  // Returns { bgColors: [hex] or [hex,hex], text }. In Full Text
  // mode a custom (gradient or manually picked) background takes priority.
  function currentCombo() {
    if (state.fullText && state.customBg) return state.customBg;
    const preset = COMBOS[state.comboIndex];
    return { bgColors: [preset.bg], text: preset.text };
  }

  function luminance(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }
  function isLightColor(hex) { return luminance(hex) > 0.6; }
  function avgIsLight(colors) {
    return (colors.reduce((s, c) => s + luminance(c), 0) / colors.length) > 0.6;
  }

  function hexToRgba(hex, alpha) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substring(0, 2), 16);
    const g = parseInt(c.substring(2, 4), 16);
    const b = parseInt(c.substring(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // Builds a solid or (2-colour) gradient fillStyle from a bgColors array.
  function bgFillStyle(colors, alpha) {
    if (alpha === undefined) alpha = 1;
    if (colors.length === 1) return hexToRgba(colors[0], alpha);
    const grad = ctx.createLinearGradient(0, 0, SIZE_W, SIZE_H);
    grad.addColorStop(0, hexToRgba(colors[0], alpha));
    grad.addColorStop(1, hexToRgba(colors[1], alpha));
    return grad;
  }

  // Auto-picks a readable text colour for a custom background.
  function contrastFor(colors) {
    const dark = !avgIsLight(colors);
    return { text: dark ? '#FFFFFF' : '#000000' };
  }

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
  }

  // A fresh, reasonably pleasant random 2-colour gradient each time it's called.
  function randomGradientColors() {
    const h1 = Math.floor(Math.random() * 360);
    const h2 = (h1 + 40 + Math.floor(Math.random() * 120)) % 360;
    const s = 65 + Math.floor(Math.random() * 20);
    const l = 42 + Math.floor(Math.random() * 16);
    return [hslToHex(h1, s, l), hslToHex(h2, s, l)];
  }

  function buildFontRow() {
    fontRow.innerHTML = '';
    FONT_OPTIONS.forEach((f) => {
      const btn = document.createElement('button');
      btn.className = 'fontChip' + (f.id === state.font.id ? ' selected' : '');
      btn.style.fontFamily = f.stack;
      btn.style.fontWeight = f.weight;
      btn.textContent = f.name;
      btn.addEventListener('click', () => {
        state.font = f;
        buildFontRow();
        drawCard();
      });
      fontRow.appendChild(btn);
    });
  }
  buildFontRow();

  function buildSwatches() {
    swatchRow.innerHTML = '';
    COMBOS.forEach((combo, i) => {
      const btn = document.createElement('button');
      const usingCustom = state.fullText && state.customBg;
      btn.className = 'swatch' + (!usingCustom && i === state.comboIndex ? ' selected' : '');
      btn.style.background = 'linear-gradient(135deg, ' + combo.bg + ' 55%, ' + combo.text + ' 55%)';
      btn.title = combo.name;
      btn.addEventListener('click', () => {
        state.comboIndex = i;
        state.customBg = null; // preset overrides any gradient/manual colour
        buildSwatches();
        drawCard();
      });
      swatchRow.appendChild(btn);
    });
  }
  buildSwatches();

  function layoutLines(wordObjs, maxWidth) {
    const spaceWidth = ctx.measureText(' ').width;
    const lines = [];
    let currentLine = [];
    let currentWidth = 0;
    wordObjs.forEach((w) => {
      const addWidth = currentLine.length ? spaceWidth + w.width : w.width;
      if (currentWidth + addWidth > maxWidth && currentLine.length) {
        lines.push(currentLine);
        currentLine = [w];
        currentWidth = w.width;
      } else {
        currentLine.push(w);
        currentWidth += addWidth;
      }
    });
    if (currentLine.length) lines.push(currentLine);
    return lines;
  }

  // Draws `img` blurred, covering the whole card (used as a Full Text mode
  // background). Drawn slightly oversized so blur edge softening stays off-canvas.
  function drawFullTextBackgroundImage(img, blurPx) {
    const margin = 40;
    const targetW = SIZE_W + margin * 2;
    const targetH = SIZE_H + margin * 2;
    const targetRatio = targetW / targetH;
    const imgRatio = img.width / img.height;
    let baseW, baseH;
    if (imgRatio > targetRatio) { baseH = img.height; baseW = baseH * targetRatio; }
    else { baseW = img.width; baseH = baseW / targetRatio; }
    const cropX = (img.width - baseW) / 2;
    const cropY = (img.height - baseH) / 2;
    ctx.save();
    ctx.filter = `blur(${blurPx}px)`;
    ctx.drawImage(img, cropX, cropY, baseW, baseH, -margin, -margin, targetW, targetH);
    ctx.restore();
  }

  function drawCard() {
    saveStyle();
    ctx.clearRect(0, 0, SIZE_W, SIZE_H);
    const combo = currentCombo();
    const splitY = state.fullText ? SIZE_H : Math.round(SIZE_H * state.textRatio);
    state.splitY = splitY;

    // ---- BACKGROUND — full canvas in Full Text mode, top area otherwise ----
    if (state.fullText && state.image) {
      // Blurred photo behind the text, tinted with the chosen colour so text stays readable
      drawFullTextBackgroundImage(state.image, state.bgBlur);
      ctx.fillStyle = bgFillStyle(combo.bgColors, state.bgTint);
      ctx.fillRect(0, 0, SIZE_W, SIZE_H);
    } else {
      ctx.fillStyle = bgFillStyle(combo.bgColors);
      ctx.fillRect(0, 0, SIZE_W, splitY);
    }

    const ctaReserve = state.ctaOn ? 280 : 100;
    const textAreaH = state.fullText ? SIZE_H - ctaReserve : splitY;
    const paddingX = 60;
    const maxWidth = SIZE_W - paddingX * 2;
    ctx.textBaseline = 'middle';
    const paragraphs = (state.text || '').split(/\n/);
    const availH = textAreaH - 70;
    let fs = state.fontSize, lines, lineHeights, totalTextHeight;
    const baseFont = (size) => `${state.font.weight} ${size}px ${state.font.stack}`;
    for (;;) { // shrink font until the hook fits its area
      ctx.font = baseFont(fs);
      let gi = 0; lines = [];
      paragraphs.forEach(para => {
        const pw = para.toUpperCase().split(/\s+/).filter(Boolean);
        if (!pw.length) { lines.push([]); return; }
        const objs = pw.map(word => {
          const idx = gi++;
          const scale = state.wordScales[idx] || 1;
          ctx.font = baseFont(fs * scale);
          return { word, idx, scale, width: ctx.measureText(word).width };
        });
        ctx.font = baseFont(fs); // space width is measured at the base size
        layoutLines(objs, maxWidth).forEach(l => lines.push(l));
      });
      lineHeights = lines.map(l => fs * 1.18 * (l.length ? Math.max(...l.map(w => w.scale)) : 1));
      totalTextHeight = lineHeights.reduce((a, b) => a + b, 0);
      const tooWide = lines.some(l => l.length === 1 && l[0].width > maxWidth);
      if ((totalTextHeight <= availH && !tooWide) || fs <= 24) break;
      fs -= 2;
    }
    ctx.font = baseFont(fs);
    const spaceWidth = ctx.measureText(' ').width;
    const lineYs = [];
    let cursorY = textAreaH / 2 - totalTextHeight / 2;
    lines.forEach((_, i) => { cursorY += lineHeights[i] / 2; lineYs.push(cursorY); cursorY += lineHeights[i] / 2; });

    ctx.textAlign = 'left';
    state.wordRects = [];
    lines.forEach((lineWords, i) => {
      const lineWidth = lineWords.reduce((sum, w) => sum + w.width, 0) + spaceWidth * (lineWords.length - 1);
      let x = SIZE_W / 2 - lineWidth / 2;
      const y = lineYs[i];
      const maxScale = lineWords.length ? Math.max(...lineWords.map(w => w.scale)) : 1;
      lineWords.forEach(w => {
        const wordColor = state.wordColors[w.idx] || combo.text;
        const wordFs = fs * w.scale;
        const wy = y + 0.35 * (fs * maxScale - wordFs); // keep all words on one baseline
        ctx.font = baseFont(wordFs);
        if (state.outline && state.outlineWidth > 0) {
          ctx.save();
          ctx.lineJoin = 'round';
          ctx.miterLimit = 2;
          ctx.lineWidth = state.outlineWidth * 2; // half is hidden under the fill
          ctx.strokeStyle = state.outlineColor || (luminance(wordColor) > 0.5 ? '#000000' : '#FFFFFF');
          ctx.strokeText(w.word, x, wy);
          ctx.restore();
        }
        ctx.fillStyle = wordColor;
        ctx.fillText(w.word, x, wy);
        state.wordRects.push({
          idx: w.idx, word: w.word, x, y: wy, w: w.width, h: wordFs,
          lineTop: y - lineHeights[i] / 2, lineH: lineHeights[i], sp: spaceWidth
        });
        x += w.width + spaceWidth;
      });
    });

    // ---- IMAGE AREA (bottom) — skipped entirely in Full Text mode ----
    if (!state.fullText) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, splitY, SIZE_W, SIZE_H - splitY);

    if (state.image) {
      const img = state.image;
      const targetW = SIZE_W, targetH = SIZE_H - splitY;
      const targetRatio = targetW / targetH;
      const imgRatio = img.width / img.height;

      let baseW, baseH;
      if (imgRatio > targetRatio) { baseH = img.height; baseW = baseH * targetRatio; }
      else { baseW = img.width; baseH = baseW / targetRatio; }

      const cropW = baseW / state.zoom;
      const cropH = baseH / state.zoom;

      state.centerX = Math.max(cropW / 2, Math.min(state.centerX, img.width - cropW / 2));
      state.centerY = Math.max(cropH / 2, Math.min(state.centerY, img.height - cropH / 2));

      const cropX = state.centerX - cropW / 2;
      const cropY = state.centerY - cropH / 2;

      state.cropW = cropW;
      state.cropH = cropH;

      ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, splitY, targetW, targetH);
    }
    } // end image-area (!state.fullText)

    // ---- BRAND + CTA BUTTON (click magnet) ----
    const onLight = state.fullText && avgIsLight(combo.bgColors);
    ctx.save();
    if (!state.fullText) {
      const scrimH = 340;
      const g = ctx.createLinearGradient(0, SIZE_H - scrimH, 0, SIZE_H);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.68)');
      ctx.fillStyle = g;
      ctx.fillRect(0, SIZE_H - scrimH, SIZE_W, scrimH);
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.font = '700 24px "Poppins", Arial, sans-serif';
    ctx.letterSpacing = '3px';
    ctx.fillStyle = onLight ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.96)';
    ctx.fillText(WATERMARK_TEXT + (state.blogUrl ? '  •  ' + state.blogUrl.toUpperCase() : ''), SIZE_W / 2, SIZE_H - 48);
    ctx.letterSpacing = '0px';
    if (state.ctaOn && state.ctaText) {
      ctx.font = '800 44px "Poppins", Arial, sans-serif';
      const tw = ctx.measureText(state.ctaText).width;
      const bw = Math.min(SIZE_W - 80, tw + 110), bh = 104;
      const bx = (SIZE_W - bw) / 2, by = SIZE_H - 48 - 42 - bh;
      ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 6;
      ctx.fillStyle = '#E60023';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.fillStyle = '#FFFFFF';
      ctx.textBaseline = 'middle';
      ctx.fillText(state.ctaText, SIZE_W / 2, by + bh / 2 + 3);
    }
    ctx.restore();

    const displayRatio = container.clientHeight / SIZE_H;
    divider.style.display = state.fullText ? 'none' : 'flex';
    divider.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.top = (splitY * displayRatio) + 'px';
    placeholderHint.style.height = ((SIZE_H - splitY) * displayRatio) + 'px';
    placeholderHint.style.display = (state.image || state.fullText) ? 'none' : 'flex';
    updateWordUI();
  }

  // Shows the dashed box around the tapped word + the resize bar
  function updateWordUI() {
    const sel = state.selectedWord === null ? null : state.wordRects.find(r => r.idx === state.selectedWord);
    if (!sel) {
      state.selectedWord = null;
      wordSel.style.display = 'none';
      wordBar.style.display = 'none';
      return;
    }
    const k = container.clientWidth / SIZE_W;
    wordSel.style.display = 'block';
    wordSel.style.left = ((sel.x - 8) * k) + 'px';
    wordSel.style.top = ((sel.y - sel.h * 0.6) * k) + 'px';
    wordSel.style.width = ((sel.w + 16) * k) + 'px';
    wordSel.style.height = (sel.h * 1.15 * k) + 'px';
    wordBar.style.display = 'flex';
    const pct = Math.round((state.wordScales[sel.idx] || 1) * 100);
    wordName.textContent = sel.word;
    wordScaleInput.value = pct;
    wordPct.textContent = pct + '%';
    wordColorPicker.value = state.wordColors[sel.idx] || currentCombo().text;
  }

  // Finds which word (if any) sits under a canvas-space point
  function wordAtPoint(pt) {
    for (const r of state.wordRects) {
      if (pt.x >= r.x - r.sp / 2 - 6 && pt.x <= r.x + r.w + r.sp / 2 + 6 &&
          pt.y >= r.lineTop && pt.y <= r.lineTop + r.lineH) return r;
    }
    return null;
  }

  function setWordScale(pct) {
    if (state.selectedWord === null) return;
    pct = Math.max(30, Math.min(300, pct));
    if (pct === 100) delete state.wordScales[state.selectedWord];
    else state.wordScales[state.selectedWord] = pct / 100;
    drawCard();
  }
  wordScaleInput.addEventListener('input', () => setWordScale(parseInt(wordScaleInput.value, 10)));
  document.getElementById('wordMinus').addEventListener('click', () => setWordScale(Math.round((state.wordScales[state.selectedWord] || 1) * 100) - 10));
  document.getElementById('wordPlus').addEventListener('click', () => setWordScale(Math.round((state.wordScales[state.selectedWord] || 1) * 100) + 10));
  document.getElementById('wordReset').addEventListener('click', () => setWordScale(100));
  function setWordColor(c) {
    if (state.selectedWord === null) return;
    if (c) state.wordColors[state.selectedWord] = c; else delete state.wordColors[state.selectedWord];
    drawCard();
  }
  wordColorPicker.addEventListener('input', () => setWordColor(wordColorPicker.value));
  document.querySelectorAll('#wordBar .qc').forEach(b => b.addEventListener('click', () => setWordColor(b.dataset.c)));
  document.getElementById('wordColorAuto').addEventListener('click', () => setWordColor(null));
  document.getElementById('wordClose').addEventListener('click', () => { state.selectedWord = null; drawCard(); });

  // Converts a pointer event's client coords into canvas-pixel coords
  // (the 1080x1350 space drawCard() works in), regardless of on-screen scale.
  function canvasPointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (SIZE_W / rect.width),
      y: (e.clientY - rect.top) * (SIZE_H / rect.height)
    };
  }

  let dragging = false;
  function ratioFromClientY(clientY) {
    const rect = container.getBoundingClientRect();
    let ratio = (clientY - rect.top) / rect.height;
    return Math.max(0.15, Math.min(0.6, ratio));
  }
  divider.addEventListener('pointerdown', (e) => {
    dragging = true;
    divider.setPointerCapture(e.pointerId);
  });
  divider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    state.textRatio = ratioFromClientY(e.clientY);
    drawCard();
  });
  divider.addEventListener('pointerup', () => { dragging = false; });
  divider.addEventListener('pointercancel', () => { dragging = false; });

  // ---- Move/reposition the image by dragging it (image area is BOTTOM) ----
  let imgDragging = false;
  let lastX = 0, lastY = 0;

  canvas.addEventListener('pointerdown', (e) => {
    const pt = canvasPointFromEvent(e);
    const inImageArea = !state.fullText && state.image && pt.y >= state.splitY;

    if (inImageArea) {
      imgDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    } else if (state.fullText || pt.y < state.splitY) {
      // Tap in the text area: select the word under the finger (tap empty space to deselect)
      const hit = wordAtPoint(pt);
      state.selectedWord = hit ? hit.idx : null;
      drawCard();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (imgDragging && state.image) {
      const rect = container.getBoundingClientRect();
      const dxDisplay = e.clientX - lastX;
      const dyDisplay = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      const displayImageHeight = rect.height * (1 - state.textRatio);
      const scaleFactorX = state.cropW / rect.width;
      const scaleFactorY = state.cropH / displayImageHeight;

      state.centerX -= dxDisplay * scaleFactorX;
      state.centerY -= dyDisplay * scaleFactorY;

      drawCard();
    }
  });

  canvas.addEventListener('pointerup', (e) => {
    imgDragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  });

  canvas.addEventListener('pointercancel', () => {
    imgDragging = false;
  });

  pickImageBtn.addEventListener('click', () => {
    fileInput.click();
  });

  fullTextToggle.addEventListener('change', () => {
    state.fullText = fullTextToggle.checked;
    fullTextExtras.style.display = state.fullText ? 'flex' : 'none';
    fullTextSliders.style.display = state.fullText ? 'flex' : 'none';
    drawCard();
  });

  bgBlurInput.addEventListener('input', () => {
    state.bgBlur = parseInt(bgBlurInput.value, 10);
    bgBlurVal.textContent = state.bgBlur;
    drawCard();
  });
  bgTintInput.addEventListener('input', () => {
    state.bgTint = parseInt(bgTintInput.value, 10) / 100;
    bgTintVal.textContent = bgTintInput.value;
    drawCard();
  });

  randomGradientBtn.addEventListener('click', () => {
    const [c1, c2] = randomGradientColors();
    const contrast = contrastFor([c1, c2]);
    state.customBg = { bgColors: [c1, c2], text: contrast.text };
    buildSwatches();
    drawCard();
  });

  bgColorPicker.addEventListener('input', () => {
    const c = bgColorPicker.value;
    const contrast = contrastFor([c]);
    state.customBg = { bgColors: [c], text: contrast.text };
    buildSwatches();
    drawCard();
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        state.image = img;
        state.zoom = 1;
        state.centerX = img.width / 2;
        state.centerY = img.height / 2;
        zoomInput.value = 100;
        zoomVal.textContent = 100;
        drawCard();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  factText.addEventListener('input', () => {
    state.text = factText.value;
    if (!state.text.trim()) { state.wordScales = {}; state.wordColors = {}; state.selectedWord = null; } // fresh hook = fresh sizes
    drawCard();
  });
  outlineToggle.addEventListener('change', () => {
    state.outline = outlineToggle.checked;
    outlineControls.style.display = state.outline ? 'flex' : 'none';
    drawCard();
  });
  outlineWidthInput.addEventListener('input', () => {
    state.outlineWidth = parseInt(outlineWidthInput.value, 10);
    outlineWidthVal.textContent = state.outlineWidth;
    drawCard();
  });
  outlineColorPicker.addEventListener('input', () => {
    state.outlineColor = outlineColorPicker.value;
    drawCard();
  });
  outlineAutoBtn.addEventListener('click', () => {
    state.outlineColor = null;
    drawCard();
  });

  fontSizeInput.addEventListener('input', () => {
    state.fontSize = parseInt(fontSizeInput.value, 10);
    fontSizeVal.textContent = state.fontSize;
    drawCard();
  });
  zoomInput.addEventListener('input', () => {
    state.zoom = parseInt(zoomInput.value, 10) / 100;
    zoomVal.textContent = zoomInput.value;
    drawCard();
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'RelationshipCues_' + ((state.text || 'pin').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'pin') + '_' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }, 'image/png');
  });

  // ---- Pinterest click boosters: hooks, CTA, SEO text ----
  const CTAS = ["READ FULL ARTICLE →", "TAP TO READ MORE →", "GET THE FULL GUIDE →", "CLICK TO READ →", "READ THIS NEXT →"];
  const ctaRow = document.getElementById('ctaRow');
  const ctaToggle = document.getElementById('ctaToggle'), ctaControls = document.getElementById('ctaControls');
  const blogUrlInput = document.getElementById('blogUrl'), seoTitle = document.getElementById('seoTitle'), seoDesc = document.getElementById('seoDesc');

  function titleCase(t) { return t.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }
  function updateSeo() {
    const hook = (state.text || '').replace(/\s+/g, ' ').trim();
    if (!hook) { seoTitle.value = ''; seoDesc.value = ''; return; }
    seoTitle.value = titleCase(hook).slice(0, 100);
    const link = state.blogUrl ? '\n\n👉 ' + state.blogUrl : '';
    seoDesc.value = hook.charAt(0) + hook.slice(1).toLowerCase() +
      '... Tap to read the full article on Relationship Cues.' + link +
      '\n\n#relationshipadvice #relationshiptips #healthyrelationships #relationshipgoals #couplegoals #datingadvice';
  }
  function buildCtaRow() {
    ctaRow.innerHTML = '';
    CTAS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'fontChip' + (c === state.ctaText ? ' selected' : '');
      b.textContent = c;
      b.addEventListener('click', () => { state.ctaText = c; buildCtaRow(); drawCard(); });
      ctaRow.appendChild(b);
    });
  }
  buildCtaRow();
  ctaToggle.addEventListener('change', () => {
    state.ctaOn = ctaToggle.checked;
    ctaControls.style.display = state.ctaOn ? 'flex' : 'none';
    drawCard();
  });
  try { state.blogUrl = localStorage.getItem('rc_blogUrl') || ''; blogUrlInput.value = state.blogUrl; } catch (e) {}
  blogUrlInput.addEventListener('input', () => {
    state.blogUrl = blogUrlInput.value.trim();
    try { localStorage.setItem('rc_blogUrl', state.blogUrl); } catch (e) {}
    drawCard(); updateSeo();
  });
  factText.addEventListener('input', updateSeo);
  function copyFrom(el, btn, label) {
    el.select();
    const done = () => { btn.textContent = '✅ Copied!'; setTimeout(() => btn.textContent = label, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(el.value).then(done).catch(() => { document.execCommand('copy'); done(); });
    else { document.execCommand('copy'); done(); }
  }
  const copyTitleBtn = document.getElementById('copyTitleBtn'), copyDescBtn = document.getElementById('copyDescBtn');
  copyTitleBtn.addEventListener('click', () => copyFrom(seoTitle, copyTitleBtn, '📋 Copy Title'));
  copyDescBtn.addEventListener('click', () => copyFrom(seoDesc, copyDescBtn, '📋 Copy Description'));
  updateSeo();

  // ---- Remember the last-used style (font, colours, sizes, outline, CTA) in this browser ----
  const STYLE_KEY = 'rc_lastStyle';
  let styleRestored = false; // don't save until the saved style has been loaded
  function saveStyle() {
    if (!styleRestored) return;
    try {
      localStorage.setItem(STYLE_KEY, JSON.stringify({
        fontId: state.font.id, comboIndex: state.comboIndex, customBg: state.customBg,
        fontSize: state.fontSize, textRatio: state.textRatio, fullText: state.fullText,
        bgBlur: state.bgBlur, bgTint: state.bgTint,
        outline: state.outline, outlineWidth: state.outlineWidth, outlineColor: state.outlineColor,
        ctaOn: state.ctaOn, ctaText: state.ctaText
      }));
    } catch (e) {}
  }
  function restoreStyle() {
    try {
      const d = JSON.parse(localStorage.getItem(STYLE_KEY) || 'null');
      if (!d) return;
      const num = (v, lo, hi) => (typeof v === 'number' && v >= lo && v <= hi);
      const f = FONT_OPTIONS.find(x => x.id === d.fontId); if (f) state.font = f;
      if (num(d.comboIndex, 0, COMBOS.length - 1)) state.comboIndex = d.comboIndex;
      if (d.customBg && Array.isArray(d.customBg.bgColors) && d.customBg.text) state.customBg = d.customBg;
      if (num(d.fontSize, 28, 150)) { state.fontSize = d.fontSize; fontSizeInput.value = d.fontSize; fontSizeVal.textContent = d.fontSize; }
      if (num(d.textRatio, 0.1, 0.9)) state.textRatio = d.textRatio;
      if (num(d.bgBlur, 0, 60)) { state.bgBlur = d.bgBlur; bgBlurInput.value = d.bgBlur; bgBlurVal.textContent = d.bgBlur; }
      if (num(d.bgTint, 0, 1)) { state.bgTint = d.bgTint; bgTintInput.value = Math.round(d.bgTint * 100); bgTintVal.textContent = Math.round(d.bgTint * 100); }
      if (typeof d.fullText === 'boolean') {
        state.fullText = d.fullText; fullTextToggle.checked = d.fullText;
        fullTextExtras.style.display = d.fullText ? 'flex' : 'none';
        fullTextSliders.style.display = d.fullText ? 'flex' : 'none';
      }
      if (typeof d.outline === 'boolean') {
        state.outline = d.outline; outlineToggle.checked = d.outline;
        outlineControls.style.display = d.outline ? 'flex' : 'none';
      }
      if (num(d.outlineWidth, 1, 30)) { state.outlineWidth = d.outlineWidth; outlineWidthInput.value = d.outlineWidth; outlineWidthVal.textContent = d.outlineWidth; }
      if (typeof d.outlineColor === 'string' && /^#[0-9a-f]{6}$/i.test(d.outlineColor)) { state.outlineColor = d.outlineColor; outlineColorPicker.value = d.outlineColor; }
      if (typeof d.ctaOn === 'boolean') {
        state.ctaOn = d.ctaOn; ctaToggle.checked = d.ctaOn;
        ctaControls.style.display = d.ctaOn ? 'flex' : 'none';
      }
      if (typeof d.ctaText === 'string' && CTAS.includes(d.ctaText)) state.ctaText = d.ctaText;
      buildFontRow(); buildSwatches(); buildCtaRow();
    } catch (e) {}
  }
  restoreStyle();
  styleRestored = true;

  // Always start with an empty text box (browsers can otherwise restore the old text on reload)
  function clearTextOnOpen() {
    factText.value = ''; state.text = '';
    seoTitle.value = ''; seoDesc.value = '';
  }
  clearTextOnOpen();
  window.addEventListener('pageshow', (e) => { if (e.persisted) { clearTextOnOpen(); drawCard(); } });

  window.addEventListener('resize', drawCard);
  window.addEventListener('load', drawCard);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(drawCard);
  }
  drawCard();
</script>
